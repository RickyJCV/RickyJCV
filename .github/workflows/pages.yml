name: Portfolio maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify portfolio files
        run: |
          test -f site/index.html
          test -f site/styles.css
          test -f site/app.js
          echo "Portfolio source files are present."
